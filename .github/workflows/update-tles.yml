name: Refresh TLE data

# Keeps the orphan `tle-data` branch topped up with fresh CelesTrak TLEs so
# the static GitHub Pages build can load the satellite catalog without the
# dev proxy. The branch is force-pushed (single-commit history, no bloat).
#
# Groups are fetched server-side with a friendly UA because CelesTrak
# throttles browser-origin requests.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TLE groups
        run: |
          # Primary: CelesTrak (friendly UA). Fallback: the GitHub-hosted
          # changshuospace mirror (JSON) — same infra as the runner, so it
          # never hits CelesTrak's egress throttling.
          fetch_group() {
            local g="$1" mirror="$2"
            echo "Fetching $g…"
            if curl -sS --fail --max-time 60 -A "Earth-Command-CI/1.0 (tle-refresh)" \
                "https://celestrak.org/NORAD/elements/gp.php?GROUP=$g&FORMAT=tle" \
                -o "tle-data/$g.tle" && [ -s "tle-data/$g.tle" ]; then
              echo "  ok: $(wc -c < tle-data/$g.tle) bytes (celestrak)"
            elif curl -sS --fail --max-time 60 -L \
                "https://github.com/Singingkettle/changshuospace-tle-mirror/releases/download/latest/$mirror.json" \
                -o "tle-data/$g.json"; then
              jq -r '.[] | select(.TLE_LINE1 != null and .TLE_LINE2 != null) | "\(.OBJECT_NAME // "UNKNOWN")\n\(.TLE_LINE1)\n\(.TLE_LINE2)"' \
                "tle-data/$g.json" > "tle-data/$g.tle"
              rm -f "tle-data/$g.json"
              echo "  ok: $(wc -c < tle-data/$g.tle) bytes (github mirror)"
            else
              echo "  FAILED: keeping previous snapshot"
              rm -f "tle-data/$g.tle"
            fi
          }
          mkdir -p tle-data
          fetch_group starlink starlink
          fetch_group oneweb oneweb
          fetch_group stations stations
          fetch_group gps-ops gps
          # Drop files that failed so we never serve stale-as-missing
          find tle-data -name '*.tle' -size 0 -delete

      - name: Rebuild orphan branch and force-push
        run: |
          git checkout --orphan tle-data
          git rm -rf . >/dev/null 2>&1 || true
          # Files are untracked, so they survive the rm — move them to the
          # branch root (the client fetches raw .../tle-data/<group>.tle).
          mv tle-data/*.tle . && rmdir tle-data
          git add .
          if git diff --cached --quiet; then
            echo "No TLE changes — skipping push"
            exit 0
          fi
          git -c user.name="Earth Command CI" \
              -c user.email="actions@users.noreply.github.com" \
              commit -m "chore: refresh TLE catalog $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:tle-data
